name: Build Foldmer.exe

on:
  push:
    branches: [ main ]
    paths:
      - 'Foldmer.py'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build .exe
        run: pyinstaller --onefile --windowed Foldmer.py

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Foldmer-windows-exe
          path: dist/Foldmer.exe
